<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>breeze</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1b1f24;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #3b82f6;
    --new: #2563eb;
    --human: #d97706;
    --wip: #7c3aed;
    --done: #6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d10;
      --fg: #e5e7eb;
      --muted: #9ca3af;
      --border: #2a2f37;
      --new: #60a5fa;
      --human: #fbbf24;
      --wip: #c4b5fd;
      --done: #9ca3af;
    }
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; line-height: 1.4; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.02em; }
  header .meta { color: var(--muted); font-size: 12px; }
  header .config { color: var(--muted); font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  header .status-pill { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--border); color: var(--fg); }
  header .status-pill.live { background: #10b98122; color: #10b981; }
  main { padding: 12px 20px; }
  .counts { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .count-chip { padding: 4px 10px; border-radius: 12px; border: 1px solid var(--border); font-size: 12px; }
  .count-chip b { font-weight: 600; margin-right: 4px; }
  .count-chip.new b { color: var(--new); }
  .count-chip.human b { color: var(--human); }
  .count-chip.wip b { color: var(--wip); }
  .count-chip.done b { color: var(--done); }
  .filters { margin-bottom: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #status-filters { display: inline-flex; gap: 8px; flex-wrap: wrap; }
  .filters input[type=search] { padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px; background: transparent; color: var(--fg); font: inherit; }
  .filters button { padding: 3px 8px; border: 1px solid var(--border); border-radius: 10px; background: transparent; color: var(--muted); font: inherit; cursor: pointer; }
  .filters button.active { color: var(--fg); border-color: var(--accent); }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 500; }
  tr.hidden { display: none; }
  td a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--muted); }
  td a:hover { border-bottom-color: var(--accent); color: var(--accent); }
  td.repo { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); font-size: 12px; }
  td.priority { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); text-align: center; }
  td.updated { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 8px; font-weight: 500; }
  .badge.new { background: color-mix(in srgb, var(--new) 15%, transparent); color: var(--new); }
  .badge.human { background: color-mix(in srgb, var(--human) 15%, transparent); color: var(--human); }
  .badge.wip { background: color-mix(in srgb, var(--wip) 15%, transparent); color: var(--wip); }
  .badge.done { background: color-mix(in srgb, var(--done) 15%, transparent); color: var(--done); }
  .badge.running { background: color-mix(in srgb, var(--wip) 15%, transparent); color: var(--wip); }
  .badge.handled { background: color-mix(in srgb, var(--done) 15%, transparent); color: var(--done); }
  .badge.skipped { background: color-mix(in srgb, var(--muted) 20%, transparent); color: var(--muted); }
  .badge.failed { background: color-mix(in srgb, var(--human) 18%, transparent); color: var(--human); }
  .badge.orphaned { background: color-mix(in srgb, var(--human) 18%, transparent); color: var(--human); }
  .badge.timed_out { background: color-mix(in srgb, var(--human) 18%, transparent); color: var(--human); }
  .badge.unknown { background: color-mix(in srgb, var(--muted) 20%, transparent); color: var(--muted); }
  .source-chip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--muted); }
  .label-chip { display: inline-block; font-size: 10px; padding: 0 6px; border-radius: 6px; background: var(--border); color: var(--muted); margin-right: 4px; }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>breeze</h1>
  <span class="config" id="runtime-config">loading…</span>
  <span class="meta" id="last-poll"></span>
  <span class="status-pill" id="sse-status">connecting</span>
</header>
<main>
  <div class="counts" id="counts"></div>
  <div class="filters">
    <input type="search" id="search" placeholder="filter by repo, title, source…" autocomplete="off" />
    <span id="status-filters"></span>
  </div>
  <table>
    <thead><tr>
      <th>status</th><th>source</th><th>repo</th><th>title</th><th class="updated">updated</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" hidden>No breeze work yet.</div>
</main>
<script>
  const state = { items: [], runtime: {}, filter: "all", query: "" };
  const HIDDEN_RUNTIME = new Set([
    "active_titles", "last_note", "last_poll_warning", "next_search_reconcile_epoch"
  ]);

  function format(ts) {
    if (!ts) return "—";
    const asNumber = Number(ts);
    const d = Number.isFinite(asNumber) && String(ts).length <= 12
      ? new Date(asNumber * 1000)
      : new Date(ts);
    if (isNaN(d)) return ts;
    const now = Date.now();
    const diff = Math.round((now - d.getTime()) / 1000);
    if (diff < 60) return diff + "s ago";
    if (diff < 3600) return Math.round(diff / 60) + "m ago";
    if (diff < 86400) return Math.round(diff / 3600) + "h ago";
    return Math.round(diff / 86400) + "d ago";
  }

  function escape(s) {
    return (s || "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  }

  function statusesIn(items) {
    const seen = new Set();
    for (const item of items) {
      if (item.status) seen.add(item.status);
    }
    return [...seen].sort((a, b) => {
      const rank = { running: 0, failed: 1, timed_out: 2, orphaned: 3 };
      const left = rank[a] ?? 10;
      const right = rank[b] ?? 10;
      return left - right || a.localeCompare(b);
    });
  }

  function renderRuntime() {
    const runtime = state.runtime || {};
    const bits = [];
    for (const [key, value] of Object.entries(runtime)) {
      if (HIDDEN_RUNTIME.has(key) || value === undefined || value === "") continue;
      if (key === "last_poll_epoch") {
        bits.unshift("poll " + format(value));
        continue;
      }
      bits.push(key.replace(/_/g, " ") + " " + value);
    }
    document.getElementById("runtime-config").textContent = bits.join(" · ") || "runtime unavailable";
    const newest = state.items[0];
    document.getElementById("last-poll").textContent = newest
      ? "latest " + format(newest.updated_at) + " · " + state.items.length + " events"
      : "";
  }

  function renderFilters(statuses) {
    const host = document.getElementById("status-filters");
    const options = ["all", ...statuses];
    if (state.filter !== "all" && !statuses.includes(state.filter)) {
      state.filter = "all";
    }
    host.innerHTML = options.map(status => {
      const active = status === state.filter ? " active" : "";
      return `<button data-status="${escape(status)}" class="${active.trim()}">${escape(status)}</button>`;
    }).join(" ");
    host.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        state.filter = btn.dataset.status;
        render();
      });
    });
  }

  function render() {
    renderRuntime();
    const statuses = statusesIn(state.items);
    renderFilters(statuses);

    const buckets = {};
    for (const item of state.items) {
      const key = item.status || "unknown";
      buckets[key] = (buckets[key] || 0) + 1;
    }
    document.getElementById("counts").innerHTML = statuses
      .map(k => `<span class="count-chip ${escape(k)}"><b>${buckets[k] || 0}</b>${escape(k)}</span>`)
      .join("");

    const q = state.query.toLowerCase();
    const rows = state.items
      .filter(item => state.filter === "all" || item.status === state.filter)
      .filter(item => {
        if (!q) return true;
        return [item.repo, item.title, item.source, item.summary, item.status]
          .some(value => (value || "").toLowerCase().includes(q));
      })
      .map(item => {
        const href = item.url || "#";
        const title = item.summary
          ? `<a href="${escape(href)}" target="_blank" rel="noopener" title="${escape(item.summary)}">${escape(item.title)}</a>`
          : `<a href="${escape(href)}" target="_blank" rel="noopener">${escape(item.title)}</a>`;
        return `<tr>
          <td><span class="badge ${escape(item.status)}">${escape(item.status)}</span></td>
          <td class="source-chip">${escape(item.source || "task")}</td>
          <td class="repo">${escape(item.repo || "—")}</td>
          <td>${title}</td>
          <td class="updated" title="${escape(item.updated_at)}">${format(item.updated_at)}</td>
        </tr>`;
      })
      .join("");

    document.getElementById("rows").innerHTML = rows;
    document.getElementById("empty").hidden = rows.length > 0;
  }

  async function refresh() {
    try {
      const [workRes, runtimeRes] = await Promise.all([
        fetch("/work", { cache: "no-store" }),
        fetch("/runtime", { cache: "no-store" }),
      ]);
      const work = workRes.ok ? await workRes.json() : { items: [] };
      state.runtime = runtimeRes.ok ? await runtimeRes.json() : {};
      state.items = work.items || [];
      render();
    } catch (error) {
      console.warn("board refresh failed", error);
    }
  }

  function connectSse() {
    const ev = new EventSource("/events");
    const pill = document.getElementById("sse-status");
    ev.addEventListener("ready", () => {
      pill.textContent = "live";
      pill.classList.add("live");
    });
    ev.addEventListener("inbox", () => refresh());
    ev.addEventListener("activity", () => refresh());
    ev.addEventListener("work", () => refresh());
    ev.onerror = () => {
      pill.textContent = "offline — retrying";
      pill.classList.remove("live");
    };
  }

  document.getElementById("search").addEventListener("input", event => {
    state.query = event.target.value;
    render();
  });

  refresh();
  connectSse();
  setInterval(refresh, 15000);
</script>
</body>
</html>
